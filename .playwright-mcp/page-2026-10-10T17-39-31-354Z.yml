              - heading [level=2] [ref=e259]:
                - strong [ref=e260]: The Swissquote Wallet Prize 🏆
              - paragraph [ref=e261]:
                - text: In the
                - strong [ref=e262]: Swissquote Wallet Challenge
                - text: ", we want teams to build the self-custody wallet Swissquote could realistically launch for its clients. The goal is to give users full control of their crypto and keys while preserving the security, simplicity, compliance, and user experience they expect from a Swiss bank. Today, clients who want self-custody must withdraw their assets to an external wallet and leave the Swissquote ecosystem. Your challenge is to create a better alternative:"
                - strong [ref=e263]: their keys, their control, while remaining one step away from their Swissquote account.
              - paragraph [ref=e264]:
                - text: Your prototype should demonstrate the complete wallet lifecycle, from
                - strong [ref=e265]: wallet creation to authentication, transaction signing, loss of access, and recovery
                - text: . Teams must make and defend a clear custody model, define a credible threat model, design the wallet architecture, explain where keys or key shares live, and show how users authenticate securely before signing transactions. The recovery mechanism should protect legitimate users without creating an easy path for attackers or giving Swissquote unintended control over client funds. At minimum, your demo must sign and send a real transaction to a blockchain, with testnet deployments fully accepted.
              - paragraph [ref=e266]:
                - text: You are free to explore approaches such as
                - strong [ref=e267]: MPC or threshold signatures, passkeys and WebAuthn, smart contract accounts using ERC-4337, seed phrases, or split-backup systems such as Shamir or SLIP-39
                - text: . Use established cryptographic libraries and SDKs rather than implementing your own cryptography. Parts that cannot realistically be built during the hackathon, such as banking infrastructure, compliance providers, or key-share servers, may be mocked as long as the distinction is clearly documented and the system architecture remains credible.
              - paragraph [ref=e268]: "Bonus points if your project:"
              - list [ref=e269]:
                - listitem [ref=e270]:
                  - text: implements
                  - strong [ref=e271]: gasless transactions
                  - text: ", so users can transfer assets such as USDC without first acquiring the network's native gas token"
                - listitem [ref=e272]:
                  - text: enables
                  - strong [ref=e273]: compliant dApp interaction
                  - text: ", such as approved dApp lists, sanctions screening, transaction simulation, or additional checks for high-value transactions"
                - listitem [ref=e274]: provides a recovery flow that can distinguish a legitimate user from an attacker who has compromised their phone or email
                - listitem [ref=e275]: creates a strong business case for Swissquote through revenue, client retention, new users, or lower operational costs
                - listitem [ref=e276]: addresses Swiss regulatory considerations around custody and wallet ownership verification in a technically credible way
              - heading [level=2] [ref=e277]:
                - strong [ref=e278]: How we will judge
              - paragraph [ref=e279]:
                - text: Projects will be evaluated on
                - strong [ref=e280]: technical implementation (35 points)
                - text: ","
                - strong [ref=e281]: security and custody design (20 points)
                - text: ","
                - strong [ref=e282]: legal feasibility (15 points)
                - text: ","
                - strong [ref=e283]: business case (15 points)
                - text: ", and"
                - strong [ref=e284]: user experience and pitch (15 points)
                - text: . Teams can earn up to
