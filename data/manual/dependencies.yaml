# Manual dependency facts the public APIs do NOT expose (off-chain issuers, backing
# composition, and asset oracles where Morpho doesn't supply one). EVERY entry carries a
# source URL and renders in the UI with a "manual" badge — nothing here is presented as if
# it were fetched live. Addresses are Ethereum mainnet, lowercased.
#
# Schema:
#   chains:   <name>: {risk_category, source}
#   issuers:  <key>:  {name, kind, defillama_slug, risk_category, source}
#   tokens:   <addr>: {symbol, kind, peg, wraps, backing_share, issuer, risk_category,
#                      oracle: {name, source}, source}
#     kind: base | stablecoin | lst | lrt | wrapper   (wrapper/lst/lrt have `wraps`)

chains:
  ethereum:
    risk_category: "Chain"
    source: "https://defillama.com/chain/Ethereum"

issuers:
  sky:
    name: "Sky (formerly MakerDAO)"
    kind: "CDP / stablecoin issuer"
    defillama_slug: "sky-lending"
    risk_category: "CDP"
    source: "https://sky.money"
  lido:
    name: "Lido"
    kind: "liquid staking"
    defillama_slug: "lido"
    risk_category: "Liquid Staking"
    source: "https://lido.fi"
  etherfi:
    name: "ether.fi"
    kind: "liquid restaking"
    defillama_slug: "ether.fi-stake"
    risk_category: "Liquid Restaking"
    source: "https://ether.fi"
  ethena:
    name: "Ethena"
    kind: "synthetic dollar"
    defillama_slug: "ethena"
    risk_category: "Synthetic Dollar"
    source: "https://ethena.fi"
  circle:
    name: "Circle"
    kind: "fiat-backed stablecoin"
    defillama_slug: "circle"
    risk_category: "Stablecoin (fiat)"
    source: "https://www.circle.com/usdc"
  tether:
    name: "Tether"
    kind: "fiat-backed stablecoin"
    defillama_slug: "tether"
    risk_category: "Stablecoin (fiat)"
    source: "https://tether.to"
  coinbase:
    name: "Coinbase"
    kind: "custodial wrapped BTC"
    risk_category: "Wrapped BTC (custodial)"
    source: "https://www.coinbase.com/cbbtc"

