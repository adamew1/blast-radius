# RECONSTRUCTED dependency snapshot of the Stream Finance → Elixir deUSD contagion (Nov 2025).
# The dependency STRUCTURE below is reconstructed from public post-mortems (sourced); it is
# labelled "reconstructed" in the UI. The PRICE SERIES used to drive the replay are REAL daily
# DefiLlama series (xUSD/deUSD/sdeUSD) — not reconstructed.
#
# The thesis this replay demonstrates: the collapse was VISIBLE UPSTREAM before it hit the
# asset you held. Stream xUSD broke on Nov 4; Elixir deUSD / sdeUSD did not collapse until
# Nov 7. A dependency-aware holder of sdeUSD, seeing the upstream xUSD break and knowing deUSD
# was ~65% backed by a loan to Stream, could EXIT on Nov 4–6 at ≈$1.06 and avoid the ~98% drop.

title: "Stream Finance → Elixir deUSD contagion"
as_of: "2025-11"
sources:
  - "https://www.theblock.co/news/defi/2025-11-04-analysts-map-285m-in-potential-exposure-across-defi-after-stream-finances-93m-loss-377491"
  - "https://www.theblock.co/post/377961/elixir-sunsets-deusd-synthetic-stablecoin-following-stream-finance-unwinding-aims-full-redemptions"
  - "https://pharos.watch/learn/case-studies/stream-elixir-contagion-2025/"
  - "https://blockeden.xyz/blog/2025/11/08/m-defi-contagion/"
  - "https://finance.yahoo.com/news/stream-finance-hit-hard-93m-084117666.html"

# The position whose stay/exit we replay.
position:
  id: stream-sdeusd
  label: "Elixir sdeUSD holding"
  size_usd: 1000000
  price_key: "ethereum:0x5C5b196aBE0d54485975D1Ec29617D42D9198326"   # real sdeUSD series

baseline:        # pre-event reference prices (Nov 1–3), for peg-deviation / shock
  xUSD: 1.264
  deUSD: 1.0
  sdeUSD: 1.068

nodes:
  - {id: "pos:stream-sdeusd", kind: position, label: "Elixir sdeUSD holding", risk_category: "Synthetic Dollar", price_name: sdeUSD}
  - {id: "token:deusd",       kind: token,    label: "Elixir deUSD", risk_category: "Synthetic Dollar", price_name: deUSD, source: "https://docs.elixir.xyz"}
  - {id: "issuer:elixir",     kind: issuer,   label: "Elixir", risk_category: "Synthetic Dollar", source: "https://elixir.xyz"}
  - {id: "lmkt:stream-private", kind: lending_market, label: "Private Morpho market (Stream sole borrower)", risk_category: "Lending", source: "https://www.theblock.co/news/defi/2025-11-04-analysts-map-285m-in-potential-exposure-across-defi-after-stream-finances-93m-loss-377491"}
  - {id: "token:xusd",        kind: token,    label: "Stream xUSD", risk_category: "Synthetic Dollar", price_name: xUSD, source: "https://finance.yahoo.com/news/stream-finance-hit-hard-93m-084117666.html"}
  - {id: "issuer:stream",     kind: issuer,   label: "Stream Finance (off-chain fund manager)", risk_category: "Synthetic Dollar", source: "https://finance.yahoo.com/news/stream-finance-hit-hard-93m-084117666.html"}
  - {id: "token:deusd-other", kind: token,    label: "deUSD other collateral (~35%)", risk_category: "Stablecoin (fiat)", source: "https://pharos.watch/learn/case-studies/stream-elixir-contagion-2025/"}
  - {id: "chain:ethereum",    kind: chain,    label: "Ethereum", risk_category: "Chain", source: "https://defillama.com/chain/Ethereum"}

# parent depends on child; loss propagates child -> parent.
edges:
  - {parent: "pos:stream-sdeusd", child: "token:deusd",        dep_type: backing,  exposure_pct: 100, note: "sdeUSD is staked deUSD"}
  - {parent: "pos:stream-sdeusd", child: "chain:ethereum",     dep_type: chain,    exposure_pct: 100}
  - {parent: "token:deusd",       child: "issuer:elixir",      dep_type: issuer,   exposure_pct: 100}
  - {parent: "token:deusd",       child: "lmkt:stream-private", dep_type: backing, exposure_pct: 65, note: "~65% of deUSD backing was a loan to Stream (Elixir ~$68M)"}
  - {parent: "token:deusd",       child: "token:deusd-other",  dep_type: backing,  exposure_pct: 35, note: "remaining deUSD collateral"}
  - {parent: "lmkt:stream-private", child: "token:xusd",       dep_type: collateral, exposure_pct: 100, note: "Stream posted xUSD as collateral"}
  - {parent: "token:xusd",        child: "issuer:stream",      dep_type: issuer,   exposure_pct: 100, note: "xUSD solvency depended on Stream's off-chain fund"}

# Sourced day-by-day narrative (Zurich/UTC dates).
events:
  "2025-11-01": "Calm. xUSD ≈ $1.26, deUSD/sdeUSD at peg. Stream exposure is hidden inside deUSD's backing."
  "2025-11-03": "Still calm on-chain, but Balancer is exploited elsewhere; risk appetite tightens."
  "2025-11-04": "Stream Finance discloses a ~$93M loss from an external fund manager and FREEZES xUSD. xUSD breaks: ~$0.95 and falling. deUSD still at peg — but its ~65% Stream backing is now impaired."
  "2025-11-05": "xUSD ≈ $0.24. Analysts map ~$285M of Stream-linked debt across Euler/Silo/Morpho/Sonic. deUSD still ~$1.00 — the downstream has not repriced yet."
  "2025-11-06": "xUSD ≈ $0.15. deUSD/sdeUSD still near peg. Last clean exit window for sdeUSD holders."
  "2025-11-07": "deUSD and sdeUSD collapse to ≈$0.01 as the Stream loss flows through. Elixir halts mint/redeem and begins winding down deUSD."
  "2025-11-14": "xUSD ≈ $0.06. deUSD effectively worthless; Elixir pursues a 1:1 claims process for pre-event holders."
