# Blast Radius configuration. Demo positions are finalized in Phase 1 after caching live data.

horizon_months: 12            # risk horizon for expected-loss / decision

monte_carlo:
  n_paths: 20000
  seed: 42

decision:
  # Compare expected net P&L of holding (carry - expected loss) against the cost of exiting.
  tail_tolerance: 0.15        # CVaR-95 above this forces at least REDUCE even if the mean is fine

# Snapshot scan universe; gross vault deposits + AMM liquidity, not unique capital.
scan_config:
  chain_id: 1
  morpho_min_tvl_usd: 10000000
  morpho_first: 200
  pendle_min_liquidity_usd: 1000000
  horizon_months: 12
  n_paths: 20000
  seed: 42
  live_miss_delay_seconds: 0.35

# Demo positions (finalized in Phase 1 from live data).
positions:
  - id: pt-susds
    kind: pendle_pt
    label: "Pendle PT-sUSDS · 26 Nov 2026"
    chain: ethereum
    chain_id: 1
    market: "0x9c560ebaf78e596cbcc27411d633a74d628dd7dc"   # PT-sUSDS market (also Morpho collateral)
    size_usd: 500000
  - id: smokehouse-usdt
    kind: morpho_vault
    label: "Morpho Smokehouse USDT"
    chain: ethereum
    chain_id: 1
    vault: "0xA0804346780b4c2e3bE118ac957D1DB82F9d7484"     # cached snapshot: 12 funded markets rendered (22 raw allocations)
    size_usd: 500000

# Historical replay — verified coin keys (see plan). Baselines noted where not 1.0.
